server {
  listen 8080;
  root /usr/share/nginx/html;
  index index.html;

  # Résolveur DNS de Docker : permet de démarrer même si "backend" n'existe pas encore
  resolver 127.0.0.11 valid=10s;
  set $backend http://backend:8080;

  # Les appels /api sont envoyés au backend
  location /api/ {
    proxy_pass $backend;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
  }

  # Angular est une SPA : toute autre URL renvoie index.html
  location / {
    try_files $uri $uri/ /index.html;
  }
}